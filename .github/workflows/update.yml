name: Daily Finance Trending

on:
  schedule:
    # 09:37 Asia/Shanghai; avoid the busy start of each hour.
    - cron: '37 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scraper.py
      - config.json
      - README.template.md
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: finance-trending-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Collect Finance Trending and archive
        run: python scraper.py
      - name: Commit updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md archived data
          if git diff --cached --quiet; then
            echo 'No archive changes'
            exit 0
          fi
          git commit -m "docs: update finance trending $(TZ=Asia/Shanghai date +%F)"
          git push
